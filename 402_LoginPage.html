<!DOCTYPE html>

<html>

<head>

  <base target="_top">

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Workspace ERP Login</title>

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

  <style>

    *{

      margin:0;

      padding:0;

      box-sizing:border-box;

      font-family:'Inter',sans-serif;

    }

    body{

      background:#f4f7fb;

      display:flex;

      justify-content:center;

      align-items:center;

      height:100vh;

    }

    .login-container{

      width:430px;

      background:#ffffff;

      border-radius:14px;

      box-shadow:0 10px 35px rgba(0,0,0,.10);

      padding:40px;

    }

    .logo{

      text-align:center;

      font-size:34px;

      margin-bottom:12px;

    }

    .title{

      text-align:center;

      font-size:28px;

      font-weight:700;

      color:#1e293b;

    }

    .subtitle{

      text-align:center;

      color:#64748b;

      margin-top:8px;

      margin-bottom:35px;

      font-size:14px;

    }

    .form-group{

      margin-bottom:20px;

    }

    label{

      display:block;

      margin-bottom:8px;

      font-size:14px;

      font-weight:600;

      color:#334155;

    }

    input{

      width:100%;

      padding:14px;

      border:1px solid #d1d5db;

      border-radius:8px;

      font-size:14px;

      outline:none;

      transition:.2s;

    }

    input:focus{

      border-color:#2563eb;

      box-shadow:0 0 0 3px rgba(37,99,235,.15);

    }

    .options{

      display:flex;

      justify-content:space-between;

      align-items:center;

      margin-bottom:25px;

      font-size:13px;

    }

    .remember{

      display:flex;

      align-items:center;

      gap:8px;

    }

    .remember input{

      width:auto;

      margin:0;

      cursor:pointer;

    }

    .forgot{

      color:#2563eb;

      text-decoration:none;

      font-weight:500;

    }

    .forgot:hover{

      text-decoration:underline;

    }

    .login-button{

      width:100%;

      padding:14px;

      background:#2563eb;

      color:#ffffff;

      border:none;

      border-radius:8px;

      cursor:pointer;

      font-size:15px;

      font-weight:600;

      transition:.25s;

    }

    .login-button:hover{

      background:#1d4ed8;

    }

    .login-button:disabled{

      opacity:.65;

      cursor:not-allowed;

    }

    .loading{

      display:none;

      text-align:center;

      margin-top:18px;

      color:#475569;

      font-size:14px;

    }

    .footer{

      text-align:center;

      margin-top:35px;

      font-size:12px;

      color:#94a3b8;

    }

    @media(max-width:600px){

      body{

        padding:20px;

      }

      .login-container{

        width:100%;

        padding:28px;

      }

    }

  </style>

</head>

<body>

<div class="login-container">

  <div class="logo">

    🏢

  </div>

  <div class="title">

    Workspace ERP

  </div>

  <div class="subtitle">

    Sign in to continue

  </div>

  <form id="loginForm">

    <div class="form-group">

      <label>Email Address</label>

      <input
        id="email"
        type="email"
        placeholder="name@company.com"
        required>

    </div>

    <div class="form-group">

      <label>Password</label>

      <input
        id="password"
        type="password"
        placeholder="Enter password"
        required>

    </div>

    <div class="options">

      <label class="remember">

        <input
          id="remember"
          type="checkbox">

        <span>Remember Me</span>

      </label>

      <a href="#"
         class="forgot">

         Forgot Password?

      </a>

    </div>

    <button
      id="loginButton"
      type="submit"
      class="login-button">

      Sign In

    </button>

    <div
      id="loading"
      class="loading">

      Signing in...

    </div>

  </form>

  <div class="footer">

    Workspace ERP Framework v3.1.0<br>

    Powered by Google Apps Script

  </div>

</div>

<script>

const form = document.getElementById("loginForm");

const button = document.getElementById("loginButton");

const loading = document.getElementById("loading");

const remembered = localStorage.getItem("WEF_LOGIN");

if(remembered){

    try{

        const data = JSON.parse(remembered);

        document.getElementById("email").value =

            data.email || "";

        document.getElementById("remember").checked =

            data.remember || false;

    }

    catch(e){}

}

form.addEventListener("submit", function(e){

    e.preventDefault();

    login();

});

form.addEventListener(

    "keydown", function(e){

    if(e.key === "Enter"){

        login();

    }

});

function login(){

    button.disabled = true;

    loading.style.display = "block";

    const request = {

        email: document.getElementById("email").value,

        password: document.getElementById("password").value,

        remember: document.getElementById("remember").checked

    };

    if(request.remember){

        localStorage.setItem(

            "WEF_LOGIN",

            JSON.stringify({

                email: request.email,

                remember: true

            })

        );

    }

    google.script.run

        .withSuccessHandler(loginSuccess)

        .withFailureHandler(loginFailure)

        .webAppPing();

        // Future:
        //
        // google.script.run
        //      .authenticateUser(request)
        //
        // Authentication Module
        //      028_Authentication

}

function loginSuccess(response){

    console.log(response);

    loading.style.display = "none";

    button.disabled = false;

    alert(

      "Login Successful"

    );

}

function loginFailure(error){

    loading.style.display = "none";

    button.disabled = false;

    alert(

      error.message ||

      "Unable to contact Workspace ERP."

    );

}

</script>

</body>

</html>
