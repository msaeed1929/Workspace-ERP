<!--
==============================================================================
Workspace ERP Framework (WEF)
==============================================================================
File        : 500_Styles.html
Layer       : Web Application
Component   : Global Style Framework
Version     : 3.1.0

Description
------------------------------------------------------------------------------
Master stylesheet for the Workspace ERP.

This file contains ALL shared styles used by every module.

Sections

01. Root Variables
02. Reset
03. Body
04. Loading Overlay
05. Application Layout
06. Sidebar
07. Header

The remaining sections will continue in Responses 2 and 3.

==============================================================================
-->

<style>

/*==============================================================================
    01. Root Variables
==============================================================================*/

:root{

    /*==========================================================
        Brand Colors
    ==========================================================*/

    --primary:#2563eb;

    --primary-dark:#1d4ed8;

    --primary-light:#dbeafe;

    --secondary:#64748b;

    --success:#10b981;

    --warning:#f59e0b;

    --danger:#ef4444;

    --info:#06b6d4;

    /*==========================================================
        Background
    ==========================================================*/

    --background:#f4f6fb;

    --surface:#ffffff;

    --surface-hover:#f8fafc;

    --border:#e5e7eb;

    /*==========================================================
        Text
    ==========================================================*/

    --text:#111827;

    --text-light:#6b7280;

    --text-inverse:#ffffff;

    /*==========================================================
        Sidebar
    ==========================================================*/

    --sidebar:#1e293b;

    --sidebar-hover:#334155;

    --sidebar-active:#2563eb;

    /*==========================================================
        Header
    ==========================================================*/

    --header-height:70px;

    --sidebar-width:260px;

    --radius:12px;

    --shadow:

        0 8px 25px rgba(0,0,0,.08);

    --transition:.25s ease;

}


/*==============================================================================
    02. Reset
==============================================================================*/

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}

html{

    width:100%;

    height:100%;

}

body{

    width:100%;

    height:100%;

    overflow:hidden;

    font-family:

        "Inter",

        sans-serif;

    background:var(--background);

    color:var(--text);

    font-size:15px;

    line-height:1.45;

}


/*==============================================================================
    03. Links
==============================================================================*/

a{

    color:inherit;

    text-decoration:none;

}

button{

    font-family:inherit;

}

input{

    font-family:inherit;

}


/*==============================================================================
    04. Loading Overlay
==============================================================================*/

#loadingOverlay{

    position:fixed;

    inset:0;

    display:none;

    justify-content:center;

    align-items:center;

    background:

        rgba(255,255,255,.70);

    backdrop-filter:blur(5px);

    z-index:99999;

}

.loading-box{

    background:var(--surface);

    padding:

        25px

        40px;

    border-radius:var(--radius);

    box-shadow:var(--shadow);

    font-weight:600;

}


/*==============================================================================
    05. Application Layout
==============================================================================*/

#erpApplication{

    display:grid;

    grid-template-columns:

        var(--sidebar-width)

        1fr;

    grid-template-rows:

        var(--header-height)

        1fr;

    width:100%;

    height:100vh;

}

main{

    overflow:auto;

    padding:30px;

    background:#f8fafc;

}

#pageTitle{

    font-size:42px;

    font-weight:700;

    margin-bottom:22px;

}


/*==============================================================================
    06. Sidebar
==============================================================================*/

.sidebar{

    grid-row:2;

    background:var(--sidebar);

    color:white;

    display:flex;

    flex-direction:column;

    overflow-y:auto;

    overflow-x:hidden;

    border-right:

        1px solid rgba(255,255,255,.05);

}

.sidebar-header{

    padding:25px;

    display:flex;

    align-items:center;

    gap:15px;

}

.sidebar-logo{

    font-size:34px;

}

.sidebar-company{

    font-size:22px;

    font-weight:700;

}

.sidebar-section{

    padding:

        18px

        25px

        10px;

    font-size:12px;

    letter-spacing:1px;

    font-weight:700;

    color:

        rgba(255,255,255,.55);

    text-transform:uppercase;

}

.sidebar-menu{

    list-style:none;

    padding:0;

    margin:0;

}

.sidebar-menu li{

    display:flex;

    align-items:center;

    gap:14px;

    padding:

        14px

        25px;

    cursor:pointer;

    transition:var(--transition);

    user-select:none;

}

.sidebar-menu li:hover{

    background:var(--sidebar-hover);

}

.sidebar-menu li.active{

    background:var(--sidebar-active);

}

.sidebar-menu .icon{

    width:24px;

    text-align:center;

}

.sidebar-menu .caption{

    flex:1;

    font-size:15px;

}

/*==============================================================================
    Sidebar Footer
==============================================================================*/

.sidebar-footer{

    margin-top:auto;

    padding:25px;

    border-top:

        1px solid rgba(255,255,255,.08);

}

.workspace-info{

    margin-bottom:18px;

}

.workspace-name{

    font-size:15px;

    font-weight:600;

}

.workspace-version{

    margin-top:4px;

    font-size:12px;

    color:

        rgba(255,255,255,.55);

}

.sidebar-logout{

    width:100%;

    padding:12px;

    border:none;

    border-radius:10px;

    background:#dc2626;

    color:white;

    cursor:pointer;

    font-weight:600;

    transition:var(--transition);

}

.sidebar-logout:hover{

    background:#b91c1c;

}


/*==============================================================================
    Sidebar Collapse
==============================================================================*/

.sidebar-collapsed{

    width:72px;

}

.sidebar-collapsed .caption,

.sidebar-collapsed .sidebar-company,

.sidebar-collapsed .sidebar-section,

.sidebar-collapsed .workspace-info{

    display:none;

}

.sidebar-collapsed .sidebar-header{

    justify-content:center;

}

.sidebar-collapsed .sidebar-menu li{

    justify-content:center;

    padding:16px 0;

}

.sidebar-collapsed .icon{

    margin:0;

}


/*==============================================================================
    07. Header
==============================================================================*/

.erp-header{

    grid-column:1 / 3;

    height:var(--header-height);

    background:white;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:0 28px;

    border-bottom:1px solid var(--border);

    box-shadow:

        0 3px 12px rgba(0,0,0,.04);

    z-index:100;

}

.header-left,

.header-center,

.header-right{

    display:flex;

    align-items:center;

}

.header-center{

    flex:1;

    justify-content:center;

}

.company-logo{

    font-size:30px;

    margin-left:18px;

}

.company-information{

    margin-left:14px;

}

.company-name{

    font-size:18px;

    font-weight:700;

    color:#1e3a8a;

}

.company-tagline{

    font-size:12px;

    color:var(--text-light);

}


/*==============================================================================
    Search
==============================================================================*/

.search-container{

    width:520px;

    display:flex;

    align-items:center;

    background:white;

    border:

        1px solid var(--border);

    border-radius:10px;

    overflow:hidden;

}

.search-container input{

    flex:1;

    border:none;

    outline:none;

    padding:

        12px

        16px;

    font-size:15px;

}

.search-button{

    border:none;

    background:white;

    cursor:pointer;

    width:52px;

    font-size:18px;

}

.search-button:hover{

    background:#f3f4f6;

}


/*==============================================================================
    Header Buttons
==============================================================================*/

.icon-button{

    width:42px;

    height:42px;

    border:none;

    border-radius:10px;

    background:white;

    cursor:pointer;

    transition:var(--transition);

    font-size:18px;

}

.icon-button:hover{

    background:#eff6ff;

}

.header-divider{

    width:1px;

    height:34px;

    background:var(--border);

    margin:

        0

        18px;

}

.header-datetime{

    font-size:14px;

    color:var(--text-light);

    margin-right:18px;

}


/*==============================================================================
    User Profile
==============================================================================*/

.user-profile{

    display:flex;

    align-items:center;

    gap:12px;

    cursor:pointer;

    padding:8px 12px;

    border-radius:12px;

    transition:var(--transition);

}

.user-profile:hover{

    background:#f3f4f6;

}

.user-avatar{

    width:42px;

    height:42px;

    border-radius:50%;

    background:var(--primary);

    display:flex;

    justify-content:center;

    align-items:center;

    color:white;

    font-size:18px;

}

.user-information{

    display:flex;

    flex-direction:column;

}

.user-name{

    font-size:15px;

    font-weight:600;

}

.user-role{

    font-size:12px;

    color:var(--text-light);

}

.profile-arrow{

    font-size:12px;

    color:var(--text-light);

}


/*==============================================================================
    Profile Menu
==============================================================================*/

.profile-menu{

    position:absolute;

    top:74px;

    right:18px;

    width:220px;

    background:white;

    border-radius:12px;

    box-shadow:var(--shadow);

    overflow:hidden;

    z-index:5000;

}

.profile-menu-item{

    padding:

        14px

        18px;

    cursor:pointer;

    transition:var(--transition);

}

.profile-menu-item:hover{

    background:#f3f4f6;

}

.profile-menu-divider{

    height:1px;

    background:var(--border);

}

.profile-menu-item.logout{

    color:#dc2626;

}

/*==============================================================================
    08. Dashboard
==============================================================================*/

.dashboard{

    display:flex;

    flex-direction:column;

    gap:24px;

}


/*==============================================================================
    Dashboard Banner
==============================================================================*/

.dashboard-banner{

    background:linear-gradient(

        135deg,

        #2563eb,

        #1d4ed8

    );

    color:white;

    border-radius:16px;

    padding:20px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    box-shadow:var(--shadow);

}

.banner-content h1{

    font-size:26px;

    font-weight:600;

    margin-bottom:10px;

}

.banner-content p{

    opacity:.90;

    font-size:18px;

}

.banner-date{

    font-size:18px;

    font-weight:500;

}


/*==============================================================================
    KPI Grid
==============================================================================*/

.kpi-grid{

    display:grid;

    grid-template-columns:

        repeat(

            auto-fit,

            minmax(240px,1fr)

        );

    gap:24px;

}

.kpi-card{

    background:var(--surface);

    border-radius:16px;

    padding:26px;

    display:flex;

    gap:18px;

    align-items:flex-start;

    box-shadow:var(--shadow);

    transition:var(--transition);

}

.kpi-card:hover{

    transform:translateY(-4px);

}

.kpi-icon{

    font-size:18px;

}

.kpi-title{

    color:var(--text-light);

    margin-bottom:10px;

    font-size:18px;

}

.kpi-value{

    font-size:36px;

    font-weight:600;

}


/*==============================================================================
    Dashboard Grid
==============================================================================*/

.dashboard-grid{

    display:grid;

    grid-template-columns:

        repeat(

            auto-fit,

            minmax(420px,1fr)

        );

    gap:24px;

}

.dashboard-card{

    background:var(--surface);

    border-radius:16px;

    overflow:hidden;

    box-shadow:var(--shadow);

}

.card-header{

    padding:

        18px

        24px;

    font-size:20px;

    font-weight:700;

    border-bottom:

        1px solid var(--border);

}

.card-body{

    padding:24px;

    min-height:220px;

}


/*==============================================================================
    Lists
==============================================================================*/

.dashboard-list{

    list-style:none;

}

.dashboard-list li{

    padding:

        12px

        0;

    border-bottom:

        1px solid var(--border);

}

.dashboard-list li:last-child{

    border-bottom:none;

}

.chart-placeholder{

    display:flex;

    justify-content:center;

    align-items:center;

    height:170px;

    color:var(--text-light);

}


/*==============================================================================
    Tables
==============================================================================*/

table{

    width:100%;

    border-collapse:collapse;

    background:white;

}

th{

    background:#f8fafc;

    font-weight:600;

}

th,

td{

    padding:14px;

    border:

        1px solid var(--border);

    text-align:left;

}

tbody tr:hover{

    background:#f9fafb;

}


/*==============================================================================
    Forms
==============================================================================*/

.form-group{

    margin-bottom:18px;

}

.form-group label{

    display:block;

    margin-bottom:8px;

    font-weight:600;

}

.form-control{

    width:100%;

    padding:12px 14px;

    border:

        1px solid var(--border);

    border-radius:10px;

    outline:none;

    transition:var(--transition);

}

.form-control:focus{

    border-color:var(--primary);

}


/*==============================================================================
    Buttons
==============================================================================*/

.btn{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    padding:

        12px

        22px;

    border:none;

    border-radius:10px;

    cursor:pointer;

    font-weight:600;

    transition:var(--transition);

}

.btn-primary{

    background:var(--primary);

    color:white;

}

.btn-primary:hover{

    background:var(--primary-dark);

}

.btn-success{

    background:var(--success);

    color:white;

}

.btn-danger{

    background:var(--danger);

    color:white;

}

.btn-warning{

    background:var(--warning);

    color:white;

}


/*==============================================================================
    Scrollbars
==============================================================================*/

::-webkit-scrollbar{

    width:10px;

    height:10px;

}

::-webkit-scrollbar-track{

    background:#f3f4f6;

}

::-webkit-scrollbar-thumb{

    background:#cbd5e1;

    border-radius:20px;

}

::-webkit-scrollbar-thumb:hover{

    background:#94a3b8;

}


/*==============================================================================
    Dark Theme
==============================================================================*/

body[data-theme="dark"]{

    background:#0f172a;

    color:#f8fafc;

}

body[data-theme="dark"] main{

    background:#111827;

}

body[data-theme="dark"] .erp-header,

body[data-theme="dark"] .dashboard-card,

body[data-theme="dark"] .kpi-card,

body[data-theme="dark"] .profile-menu,

body[data-theme="dark"] .loading-box{

    background:#1e293b;

    color:white;

}

body[data-theme="dark"] .search-container{

    background:#0f172a;

    border-color:#334155;

}

body[data-theme="dark"] .search-container input{

    background:#0f172a;

    color:white;

}

body[data-theme="dark"] .search-button,

body[data-theme="dark"] .icon-button{

    background:#1e293b;

    color:white;

}

body[data-theme="dark"] .dashboard-list li,

body[data-theme="dark"] th,

body[data-theme="dark"] td,

body[data-theme="dark"] .card-header{

    border-color:#334155;

}

body[data-theme="dark"] table{

    background:#1e293b;

}

body[data-theme="dark"] tbody tr:hover{

    background:#334155;

}


/*==============================================================================
    Responsive
==============================================================================*/

@media(max-width:1200px){

    .dashboard-grid{

        grid-template-columns:1fr;

    }

}

@media(max-width:900px){

    #erpApplication{

        grid-template-columns:72px 1fr;

    }

    .company-information,

    .banner-date{

        display:none;

    }

    .search-container{

        width:260px;

    }

}

@media(max-width:768px){

    .erp-header{

        padding:0 12px;

    }

    .header-center{

        display:none;

    }

    main{

        padding:18px;

    }

    .dashboard-banner{

        flex-direction:column;

        align-items:flex-start;

        gap:15px;

    }

}


/*==============================================================================
    Utility Classes
==============================================================================*/

.text-center{

    text-align:center;

}

.text-right{

    text-align:right;

}

.mt-1{margin-top:10px;}
.mt-2{margin-top:20px;}
.mt-3{margin-top:30px;}

.mb-1{margin-bottom:10px;}
.mb-2{margin-bottom:20px;}
.mb-3{margin-bottom:30px;}

.hidden{

    display:none !important;

}

.flex{

    display:flex;

}

.grid{

    display:grid;

}

.w-100{

    width:100%;

}

/*==============================================================================
    End of File
==============================================================================*/

</style>
