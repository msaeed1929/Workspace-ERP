<script>

"use strict";

/*==============================================================================
    Loading Spinner
==============================================================================*/

const LoadingSpinner = (function(){

    let initialized = false;

    let overlay = null;

    let messageElement = null;

    let visible = false;

    /*==========================================================================
        Initialize
    ==========================================================================*/

    function initialize(containerId){

        overlay =

            document.getElementById(

                containerId

            );

        if(!overlay){

            console.warn(

                "LoadingSpinner container not found:",

                containerId

            );

            return;

        }

        messageElement =

            overlay.querySelector(

                ".erp-loading-message"

            );

        initialized = true;

        console.log(

            "LoadingSpinner Initialized"

        );

    }

    /*==========================================================================
        Show
    ==========================================================================*/

    function show(message){

        if(!overlay){

            return;

        }

        if(messageElement){

            messageElement.textContent =

                message ||

                "Loading...";

        }

        overlay.style.display =

            "flex";

        visible = true;

    }

    /*==========================================================================
        Hide
    ==========================================================================*/

    function hide(){

        if(!overlay){

            return;

        }

        overlay.style.display =

            "none";

        visible = false;

    }

    /*==========================================================================
        Toggle
    ==========================================================================*/

    function toggle(){

        if(

            visible

        ){

            hide();

        }

        else{

            show();

        }

    }

    /*==========================================================================
        Set Message
    ==========================================================================*/

    function setMessage(message){

        if(

            messageElement

        ){

            messageElement.textContent =

                message;

        }

    }

    /*==========================================================================
        Is Visible
    ==========================================================================*/

    function isVisible(){

        return visible;

    }

    /*==========================================================================
        Refresh
    ==========================================================================*/

    function refresh(){

        if(

            visible &&

            overlay

        ){

            overlay.offsetHeight;

        }

    }

    /*==========================================================================
        Reset
    ==========================================================================*/

    function reset(){

        hide();

        setMessage(

            "Loading..."

        );

    }

    /*==========================================================================
        Status
    ==========================================================================*/

    function status(){

        return {

            initialized :

                initialized,

            visible :

                visible,

            message :

                messageElement ?

                messageElement.textContent

                : ""

        };

    }

    /*==========================================================================
        Public API
    ==========================================================================*/

    return {

        initialize : initialize,

        show : show,

        hide : hide,

        toggle : toggle,

        setMessage : setMessage,

        isVisible : isVisible,

        refresh : refresh,

        reset : reset,

        status : status

    };

})();

/*==============================================================================
    Global API
==============================================================================*/

window.LoadingSpinner = LoadingSpinner;

/*==============================================================================
    Compatibility Functions
==============================================================================*/

window.showLoader = function(message){

    LoadingSpinner.show(

        message

    );

};

window.hideLoader = function(){

    LoadingSpinner.hide();

};

window.loadingStatus = function(){

    return LoadingSpinner.status();

};
