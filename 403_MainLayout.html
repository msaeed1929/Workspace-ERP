<!--============================================================
    Global Error Handler
=============================================================-->

<script>

  window.onerror = function(
      
      message,

      source,

      line,

      column,

      error

  ){

      console.error(

          "[WEF Error]",

          {

              message : message,

              source : source,

              line : line,

              column : column,

              error : error

          }

      );

      return false;

  };

</script>


<!--============================================================
    Unhandled Promise Rejections
=============================================================-->

<script>

window.addEventListener(

    "unhandledrejection",

    function(event){

        console.error(

            "[WEF Promise]",

            event.reason

        );

    }

);

</script>
