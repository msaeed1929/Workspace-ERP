<script>

"use strict";

/*==============================================================================
    Dashboard Client
==============================================================================*/

window.DashboardClient = {

    initialized : false,

    /*==========================================================================
        Initialize
    ==========================================================================*/

    initialize : function(){

        if(this.initialized){

            return;

        }

        this.initialized = true;

        console.log(

            "DashboardClient Initialized"

        );

        this.refresh();

    },

    /*==========================================================================
        Refresh Dashboard
    ==========================================================================*/

    refresh : function(){

        this.updateWelcome();

        this.updateDate();

        this.loadKPIs();

        this.loadRecentActivities();

        this.loadInventoryAlerts();

        this.loadPendingTasks();

    },

    /*==========================================================================
        Welcome Message
    ==========================================================================*/

    updateWelcome : function(){

        const title =

            document.getElementById(

                "dashboardWelcome"

            );

        if(!title){

            return;

        }

        let user = "User";

        if(

            window.ERP &&

            ERP.bootstrap &&

            ERP.bootstrap.metadata

        ){

            user =

                ERP.bootstrap.metadata.user ||

                "User";

        }

        title.textContent =

            "Welcome, " + user;

    },

    /*==========================================================================
        Current Date
    ==========================================================================*/

    updateDate : function(){

        const element =

            document.getElementById(

                "dashboardDate"

            );

        if(!element){

            return;

        }

        const now = new Date();

        element.textContent =

            now.toLocaleDateString(

                undefined,

                {

                    weekday : "long",

                    year : "numeric",

                    month : "long",

                    day : "numeric"

                }

            );

    },

    /*==========================================================================
        KPI Loader
    ==========================================================================*/

    loadKPIs : function(){

        const values = {

            salesToday :

                "PKR 0",

            customerCount :

                "0",

            inventoryCount :

                "0",

            receivableAmount :

                "PKR 0"

        };

        Object.keys(values)

        .forEach(function(id){

            const el =

                document.getElementById(id);

            if(el){

                el.textContent = values[id];

            }

        });

    },

    /*==========================================================================
        Recent Activities
    ==========================================================================*/

    loadRecentActivities : function(){

        const list =

            document.getElementById(

                "recentActivities"

            );

        if(!list){

            return;

        }

        list.innerHTML = "";

        [

            "Workspace ERP started successfully.",

            "Dashboard initialized.",

            "Framework Version 3.1.0 loaded."

        ]

        .forEach(function(text){

            const li =

                document.createElement("li");

            li.textContent = text;

            list.appendChild(li);

        });

    },

    /*==========================================================================
        Inventory Alerts
    ==========================================================================*/

    loadInventoryAlerts : function(){

        const list =

            document.getElementById(

                "inventoryAlerts"

            );

        if(!list){

            return;

        }

        list.innerHTML = "";

        const li =

            document.createElement("li");

        li.textContent =

            "No inventory alerts.";

        list.appendChild(li);

    },

    /*==========================================================================
        Pending Tasks
    ==========================================================================*/

    loadPendingTasks : function(){

        const list =

            document.getElementById(

                "pendingTasks"

            );

        if(!list){

            return;

        }

        list.innerHTML = "";

        const li =

            document.createElement("li");

        li.textContent =

            "No pending tasks.";

        list.appendChild(li);

    },

    /*==========================================================================
        Module Activated
    ==========================================================================*/

    activate : function(){

        this.refresh();

        console.log(

            "Dashboard Activated"

        );

    },

    /*==========================================================================
        Reset
    ==========================================================================*/

    reset : function(){

        this.initialized = false;

        console.log(

            "DashboardClient Reset"

        );

    }

};

/*==============================================================================
    Backward Compatibility
==============================================================================*/

window.refreshDashboard = function(){

    if(window.DashboardClient){

        DashboardClient.refresh();

    }

};

window.initializeDashboard = function(){

    if(window.DashboardClient){

        DashboardClient.initialize();

    }

};

console.log(

    "Workspace ERP Dashboard Client Loaded"

);

</script>
