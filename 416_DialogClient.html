<!--
==============================================================================
Workspace ERP Framework (WEF)
==============================================================================
File        : 416_DialogClient.html
Layer       : Client Controller
Component   : Dialog Manager
Version     : 3.1.0
Description : Centralized dialog and modal controller.
==============================================================================
-->

<style>

#wefDialogOverlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.45);

    display:none;

    justify-content:center;

    align-items:center;

    z-index:99999;

}

.wef-dialog{

    width:480px;

    max-width:92%;

    background:#ffffff;

    border-radius:12px;

    box-shadow:0 20px 60px rgba(0,0,0,.25);

    overflow:hidden;

    animation:dialogFade .18s ease;

}

.wef-dialog-header{

    padding:18px 22px;

    font-size:18px;

    font-weight:600;

    border-bottom:1px solid #e5e7eb;

    color:#1f2937;

}

.wef-dialog-body{

    padding:24px;

    color:#374151;

    line-height:1.6;

    font-size:14px;

}

.wef-dialog-footer{

    display:flex;

    justify-content:flex-end;

    gap:10px;

    padding:18px 22px;

    border-top:1px solid #e5e7eb;

}

.wef-button{

    border:none;

    border-radius:8px;

    padding:10px 18px;

    cursor:pointer;

    font-size:14px;

    font-weight:600;

}

.wef-button-primary{

    background:#2563eb;

    color:#ffffff;

}

.wef-button-primary:hover{

    background:#1d4ed8;

}

.wef-button-secondary{

    background:#e5e7eb;

    color:#374151;

}

.wef-button-secondary:hover{

    background:#d1d5db;

}

@keyframes dialogFade{

    from{

        opacity:0;

        transform:translateY(-10px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}

</style>

<div id="wefDialogOverlay">

    <div class="wef-dialog">

        <div id="wefDialogTitle"

             class="wef-dialog-header">

            Dialog

        </div>

        <div id="wefDialogBody"

             class="wef-dialog-body">

        </div>

        <div id="wefDialogFooter"

             class="wef-dialog-footer">

        </div>

    </div>

</div>

<script>

"use strict";

/*==============================================================================
    Dialog Client
==============================================================================*/

const DialogClient = (function(){

    let overlay;

    let title;

    let body;

    let footer;

    let opened = false;

    /*==========================================================================
        Initialize
    ==========================================================================*/

    function initialize(){

        overlay =

            document.getElementById(

                "wefDialogOverlay"

            );

        title =

            document.getElementById(

                "wefDialogTitle"

            );

        body =

            document.getElementById(

                "wefDialogBody"

            );

        footer =

            document.getElementById(

                "wefDialogFooter"

            );

        if(!overlay){

            return;

        }

        overlay.addEventListener(

            "click",

            function(event){

                if(

                    event.target === overlay

                ){

                    close();

                }

            }

        );

        document.addEventListener(

            "keydown",

            function(event){

                if(

                    event.key === "Escape" &&

                    opened

                ){

                    close();

                }

            }

        );

        console.log(

            "DialogClient Initialized"

        );

    }

    /*==========================================================================
        Open Dialog
    ==========================================================================*/

    function open(options){

        options = options || {};

        title.textContent =

            options.title ||

            "Workspace ERP";

        body.innerHTML =

            options.message ||

            "";

        footer.innerHTML = "";

        buildButtons(

            options.buttons ||

            []

        );

        overlay.style.display =

            "flex";

        opened = true;

    }

    /*==========================================================================
        Build Buttons
    ==========================================================================*/

    function buildButtons(buttons){

        if(

            !buttons ||

            buttons.length === 0

        ){

            buttons = [

                {

                    text : "OK",

                    primary : true,

                    action : close

                }

            ];

        }

        buttons.forEach(function(button){

            const element =

                document.createElement(

                    "button"

                );

            element.className =

                "wef-button " +

                (

                    button.primary

                    ? "wef-button-primary"

                    : "wef-button-secondary"

                );

            element.textContent =

                button.text ||

                "Button";

            element.onclick = function(){

                if(

                    typeof button.action ===

                    "function"

                ){

                    button.action();

                }

                else{

                    close();

                }

            };

            footer.appendChild(

                element

            );

        });

    }

    /*==========================================================================
        Alert Dialog
    ==========================================================================*/

    function alertDialog(

        titleText,

        message

    ){

        open({

            title :

                titleText ||

                "Workspace ERP",

            message :

                message ||

                "",

            buttons : [

                {

                    text : "OK",

                    primary : true,

                    action : close

                }

            ]

        });

    }

    /*==========================================================================
        Confirmation Dialog
    ==========================================================================*/

    function confirmDialog(

        titleText,

        message,

        yes,

        no

    ){

        open({

            title :

                titleText ||

                "Confirmation",

            message :

                message ||

                "",

            buttons : [

                {

                    text : "Cancel",

                    primary : false,

                    action : function(){

                        close();

                        if(

                            typeof no ===

                            "function"

                        ){

                            no();

                        }

                    }

                },

                {

                    text : "Confirm",

                    primary : true,

                    action : function(){

                        close();

                        if(

                            typeof yes ===

                            "function"

                        ){

                            yes();

                        }

                    }

                }

            ]

        });

    }

    /*==========================================================================
        Close Dialog
    ==========================================================================*/

    function close(){

        if(!overlay){

            return;

        }

        overlay.style.display =

            "none";

        opened = false;

    }

    /*==========================================================================
        Public API
    ==========================================================================*/

    return {

        initialize :

            initialize,

        open :

            open,

        close :

            close,

        alert :

            alertDialog,

        confirm :

            confirmDialog

    };

})();

/*==============================================================================
    Compatibility Helpers
==============================================================================*/

window.showDialog =

function(options){

    DialogClient.open(

        options

    );

};

window.closeDialog =

function(){

    DialogClient.close();

};

window.showAlert =

function(title,message){

    DialogClient.alert(

        title,

        message

    );

};

window.showConfirm =

function(

    title,

    message,

    yes,

    no

){

    DialogClient.confirm(

        title,

        message,

        yes,

        no

    );

};

console.log(

    "Workspace ERP Duialog Client Loaded"

);

</script>
